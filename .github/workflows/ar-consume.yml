name: AR-CONSUME
on:
  workflow_run:
    workflows: [AR-PLAIN]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - name: record which run attempt produced this event
        run: |
          echo "CONSUME_EVENT_RUN_ID=${{ github.event.workflow_run.id }}"
          echo "CONSUME_EVENT_RUN_ATTEMPT=${{ github.event.workflow_run.run_attempt }}"
          echo "CONSUME_EVENT_HEAD_SHA=${{ github.event.workflow_run.head_sha }}"
          echo "CONSUME_EVENT_CONCLUSION=${{ github.event.workflow_run.conclusion }}"
          echo "CONSUME_EVENT_TRIGGERING_ACTOR=${{ github.event.workflow_run.triggering_actor.login }}"
      - name: fetch the newest build-output artifact of that run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts"             --jq '.artifacts | map(select(.name=="build-output")) | sort_by(.created_at) | last | "\(.id) \(.created_at) \(.size_in_bytes)"' > sel.txt
          echo "CONSUME_SELECTED=$(cat sel.txt)"
          AID=$(cut -d' ' -f1 sel.txt)
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > a.zip
          mkdir incoming && cd incoming && unzip -oq ../a.zip
          echo "CONSUME_ARTIFACT_FILES=$(ls)"
      - name: use the artifact
        working-directory: incoming
        env:
          LAB_SECRET: ${{ secrets.LAB_SECRET }}
        run: |
          echo "CONSUME_ARTIFACT_CONTENT:"
          cat report.sh
          bash report.sh
