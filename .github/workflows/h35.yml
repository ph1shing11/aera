name: h35
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          TOK: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, time
          tok = os.environ['TOK']
          print('token prefix', tok[:4])
          paths = ['/v1/user',
                   '/v1/repos/robenn044/aera/merge-queue/status',
                   '/v1/repos/mgfy-lab-org-1/open-svc/merge-queue/status',
                   '/v1/repos/mgfy-lab-org-1/secret-svc/merge-queue/status',
                   '/v1/ci/robenn044/repositories/aera/quarantines',
                   '/v1/ci/mgfy-lab-org-1/repositories/open-svc/quarantines',
                   '/v1/repos/mgfy-lab-org-1/open-svc/queues/configuration']
          for p in paths:
              for auth in (True, False):
                  h = {'User-Agent': 'research-h35'}
                  if auth: h['Authorization'] = 'Bearer ' + tok
                  r = urllib.request.Request('https://api.mergify.com' + p, headers=h)
                  try:
                      resp = urllib.request.urlopen(r, timeout=20); s, b = resp.status, resp.read()
                  except urllib.error.HTTPError as e:
                      s, b = e.code, e.read()
                  print('auth' if auth else 'none', s, p, b[:150].decode('utf-8', 'replace').replace('\n', ' '))
                  time.sleep(0.4)
          PY
