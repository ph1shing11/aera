name: AR-PLAIN
on:
  pull_request:
jobs:
  plain:
    runs-on: ubuntu-latest
    steps:
      - name: definition marker
        run: |
          echo "DEFN_VERSION=1-APPROVED"
          echo "DEFN_ATTEMPT=${{ github.run_attempt }}"
          echo "DEFN_PINNED_GITHUB_SHA=$GITHUB_SHA"
          echo "DEFN_EVENT_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
      - name: checkout at the pinned merge commit, no job-time fetch
        uses: actions/checkout@v4
      - name: build the artifact from the checked-out tree
        run: |
          mkdir -p out
          cp ci/report.sh out/report.sh
          echo "DEFN_ARTIFACT_SHA=$(git rev-parse HEAD)"
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: out/
      - name: ordinary slow build step
        run: sleep 70
      - name: fail so the retry rule matches
        run: exit 1
